name: Site

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

# PR code, content transforms, dependencies, and browser tests never get a write token.
permissions:
  contents: read

# Serialize the ENTIRE production pipeline, including release. Do not cancel a
# deployment that has started. Superseded/re-run commits are also checked below.
concurrency:
  group: site-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check branch and Conventional Commit title
        if: github.event_name == 'pull_request'
        run: node scripts/validate-pr.mjs
      - name: Main is validated again below
        if: github.event_name == 'push'
        run: echo 'PR policy was checked before merge; verify the main commit again.'

  verify:
    name: Verify site
    needs: validate-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Explicit bases are required because checkout uses a detached merge/main SHA.
      CONTENT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out the exact commit with history and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Static and type checks
        run: npm run check
      - name: Check metadata and changed Chinese article structure
        run: npm run lint:content
      - name: Content, route, and governance tests
        run: npm run test
      - name: Build production site and Pagefind index
        run: npm run build
      - name: Verify generated routes, links, feeds, and search
        run: npm run test:built
      - name: Install the lockfile-pinned Chromium browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser tests against the production preview
        run: npm run test:e2e
      - name: Inspect release plan without writing tags or releases
        run: npm run release:dry-run
      - name: Preserve browser screenshots, traces, and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the verified production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./dist
          retention-days: 30

  deploy:
    name: Deploy Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.deployment.outcome == 'success' }}
      sha: ${{ github.sha }}
    steps:
      # A rerun of an old workflow must not roll production back accidentally.
      # No repository code or npm dependency executes in the privileged deploy job.
      - name: Reject a superseded production commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              'X-GitHub-Api-Version': '2026-03-10',
            },
            redirect: 'error',
            signal: AbortSignal.timeout(30_000),
          });
          if (!response.ok) throw new Error(`Cannot verify main: HTTP ${response.status}`);
          const current = (await response.json()).object.sha === process.env.GITHUB_SHA;
          appendFileSync(process.env.GITHUB_OUTPUT, `current=${current}\n`);
          if (!current) appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nSkipped stale deployment: main has advanced.\n');
          NODE
      - name: Configure GitHub Pages
        if: steps.current.outputs.current == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy the verified artifact
        id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  release:
    name: Release site
    needs: [verify, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out only the deployed main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node without installing site dependencies
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Create or recover the semantic version release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_RESULT: ${{ needs.deploy.result }}
          DEPLOYED_SHA: ${{ needs.deploy.outputs.sha }}
        run: node scripts/release.mjs --publish
